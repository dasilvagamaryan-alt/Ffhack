name: Build FFHack

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NDK r25c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install tools
        run: sudo apt-get install -y ninja-build unzip

      - name: Extract sources
        run: unzip FFHack.zip -d extracted

      - name: Clone Dobby
        run: git clone --depth=1 https://github.com/jmpews/Dobby.git extracted/FFHack/external/Dobby

      - name: Clone ImGui
        run: git clone --depth=1 --branch v1.90 https://github.com/ocornut/imgui.git extracted/FFHack/external/imgui

      - name: Configure CMake
        run: |
          cmake -B build \
            -S extracted/FFHack \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -GNinja

      - name: Build
        run: cmake --build build --target ffhack -j$(nproc)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ffhack-so
          path: build/libffhack.so
          retention-days: 30
